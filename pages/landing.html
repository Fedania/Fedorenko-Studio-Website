<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio - Your Name</title>
        <link rel="stylesheet" href="/dist/main.css">
        <link href="images/favicon.ico" rel="shortcut icon" type="image/x-icon">
        <link href="images/webclip.png" rel="apple-touch-icon">
        <script type="module" src="/script.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://unpkg.com/@rive-app/webgl2"></script>
        

    </head>
    <body id="landing">
        
        <div id="page__overlay"></div>
        <div id="navigation"></div>
        <div class="page__wrapper">
              
                <section id="hero" class="section landing">
                    <div class="content-frame"></div>
                    <div class="landing__hero__options" id="controls">
                        <div
                            data-option="b"
                            class="landing__hero__option-btn"
                            role="button"
                            tabindex="0"
                            >
                            <h1>think big</h1>
                        </div>

                        <div
                            data-option="a"
                            class="landing__hero__option-btn"
                            role="button"
                            tabindex="0"
                            >
                            <h1>start small</h1>
                        </div>


                        <div class="spacer--large"></div>
                        <div class="landing__hero__subtitle">
                            <div><strong>Branding and communication designed to move people and businesses</strong></div>
                        </div>
                    </div>
                </section>
            <div class="page__content">      
                <section id="content-default"></section>
                <section id="content-start-small"></section>
                <section id="content-think-big"></section>
            </div>    
            
        </div>
        <footer id="footer" class="footer"></footer>
        
</body>
</html>
